<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Review Form</title>
  <meta name="description" content=" You are welcome to submit your product review using this form.">
  <author content="Augustine Musa Baimba">
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>
<body>
  <header>
    <h1 class="h1">Submit Your Product Review</h1>
  </header>

  <main>
    <form method="get" action="review.html">
      <!-- Product Name -->
      <label for="product">Product Name:</label>
      <select id="product" name="product" required>
        <option value="" disabled selected>Select a Product ...</option>
        <!-- Options populated dynamically -->
      </select>

      <!-- Overall Rating -->
      <fieldset>
        <legend >Overall Rating:</legend>
        <label><input type="radio" id="rating1" name="rating1" value="1" required> ☆ </label>
        <label><input type="radio" id="rating2" name="rating2" value="2" required> ☆☆</label>
        <label><input type="radio" id="rating3" name="rating3" value="3" required> ☆☆☆</label>
        <label><input type="radio" id="rating4" name="rating4" value="4" required> ☆☆☆☆</label>
        <label><input type="radio" id="rating5" name="rating5" value="5" required> ☆☆☆☆☆</label>
      </fieldset>

      <!-- Date of Installation -->
      <label for="installDate">Date of Installation:</label>
      <input type="date" id="installDate" name="installDate" required>

      <!-- Useful Features -->
      <fieldset>
        <legend>Which Features did you find useful in the product? (check all that apply):</legend>
        <label><input type="checkbox" id="feature1" name="features" value="Durability"> Durability</label>
        <label><input type="checkbox" id="feature2" name="features" value="Ease of Use"> Ease of Use</label>
        <label><input type="checkbox" id="feature3" name="features" value="Design"> Design</label>
        <label><input type="checkbox" id="feature4" name="features" value="Performance"> Performance</label>
      </fieldset>

      <!-- Written Review -->
      <label for="review">Written Review:(Optional)</label>
      <textarea id="review" name="review" rows="4" cols="50"></textarea>

      <!-- User Name -->
      <label for="username">Your Name:</label>
      <input type="text" id="username" name="username">

      <!-- Submit -->
      <input type="submit" value="Submit Review">
    </form>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> Augustine Musa Baimba # Sierra Leone</p>
  <p>Last Modified: <span id="lastModified"></span></p>
  </footer>
</body>
</html>
